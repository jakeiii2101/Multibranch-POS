name: SniperPOS baseline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - chore/codespaces-baseline

permissions:
  contents: read

jobs:
  sqlite-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify clean SQLite migrations
        run: |
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --force

      - name: Run Laravel test suite on SQLite
        run: php artisan test

  mysql-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: sniperpos_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sniperpos_testing
      DB_USERNAME: root
      DB_PASSWORD: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Verify driver and clean MySQL migrations
        run: |
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'
          php artisan migrate --force

      - name: Run Laravel test suite on MySQL
        run: php artisan test

  codespaces-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build PHP development image
        run: docker build -t sniperpos-codespaces -f .devcontainer/Dockerfile .devcontainer
      - name: Verify matching PHP and MySQL extension
        run: |
          docker run --rm sniperpos-codespaces php -v
          docker run --rm sniperpos-codespaces php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'
